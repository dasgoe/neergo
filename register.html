<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEERGO - Inscription</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="app-container">
        <div class="hero-header">
            <div class="brand">
                <span class="brand-box">N</span> NEER
            </div>
            <h1>Rejoins<span>L'App.</span></h1>
        </div>

        <div class="content-section">
            <div class="section-title">Créer un compte</div>
            <h2>Commence à t'exercer</h2>
            <div class="subtitle">Prépare ton CE1D de manière fun.</div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="exemple@classe.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" placeholder="Min. 6 caractères" required>
                </div>
                <button type="submit" class="btn-primary">
                    Créer mon compte <span>→</span>
                </button>
            </form>

            <a href="index.html" class="link-secondary">J'ai déjà un compte</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "JOUW-ANON-KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                alert("Erreur d'inscription: " + error.message);
            } else {
                alert("Compte créé ! Tu peux maintenant te connecter.");
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
